name: Build Sonix APK & Release AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Debug Keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: sonix-debug-keystore-v1-${{ hashFiles('debug.keystore.base64') }}
      - name: Generate Debug Keystore (if missing)
        run: |
          mkdir -p ~/.android
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored static debug.keystore from debug.keystore.base64"
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated new debug.keystore (will remain fixed via cache)"
            fi
          else
            echo "Using existing static debug.keystore"
          fi
          cp -f debug.keystore ~/.android/debug.keystore
      - name: Decode Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          fi
      - name: Print Release Keystore Fingerprints
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          keytool -list -v -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "$RELEASE_STORE_PASSWORD" \
            | awk '/SHA1:|SHA-1:/ { print "SHA1: " $NF } /SHA256:|SHA-256:/ { print "SHA256: " $NF }'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - name: Build Signed Release AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon
      - name: Build Signed Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonix-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload Release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: Sonix-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
      - name: Upload Release APK (Official)
        uses: actions/upload-artifact@v4
        with:
          name: Sonix-Release-APK
          path: app/build/outputs/apk/release/*.apk
